<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>AURA — Kişisel Asistan</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#02050b;color:#eefaff}body{overflow-x:hidden}.app{min-height:100vh;background:radial-gradient(circle at 50% 10%,#123c55 0,#050b13 38%,#02050b 78%)}header{height:72px;padding:0 24px;border-bottom:1px solid #183b51;background:#050b13e8;backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:7px;font-size:21px}.logo{width:40px;height:40px;border:1px solid #5ceaff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 28px #31dfff55}.logo:after{content:"";width:14px;height:14px;border-radius:50%;background:#02050a;box-shadow:0 0 22px #70efff}.status{font-size:11px;color:#72efbe;border:1px solid #28614d;border-radius:30px;padding:8px 12px}.layout{display:grid;grid-template-columns:235px 1fr 295px;min-height:calc(100vh - 72px)}aside{padding:20px;background:#03091288}.left{border-right:1px solid #122d3e}.right{border-left:1px solid #122d3e}.label{font-size:10px;letter-spacing:2px;color:#64849a;margin:4px 0 10px}.nav,.btn,.chip{border:1px solid #1b4056;background:#071522;color:#bfd2dd;border-radius:11px;cursor:pointer;transition:.2s}.nav{display:block;width:100%;padding:12px;text-align:left;margin:4px 0}.nav:hover,.nav.active,.btn:hover,.chip:hover{background:#0d2d44;border-color:#42c9ec;color:#fff}.panel{border:1px solid #16364b;background:#07121d;border-radius:15px;padding:14px;margin-bottom:10px;box-shadow:0 8px 30px #0003}.project{padding:12px;border:1px solid #17364a;border-radius:12px;margin:7px 0}.project small{display:block;color:#617c8f;margin-top:4px}.main{display:flex;justify-content:center;padding:20px}.hero{width:min(850px,100%);text-align:center}.core{width:370px;height:370px;margin:auto;position:relative;display:grid;place-items:center}.orbit{position:absolute;border:1px solid #49e1ff55;border-radius:50%;inset:9%;animation:spin 12s linear infinite}.orbit.two{inset:1%;border-style:dashed;border-color:#9a76ff55;animation:spin 19s linear infinite reverse}.orbit.three{inset:-7%;border-color:#49e1ff22;animation:pulse 4s infinite}.orbit.four{inset:18%;border-color:#8cefff33;animation:spin 7s linear infinite reverse}.coreball{width:148px;height:148px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#313d48,#090e14 45%,#010203 78%);border:1px solid #465963;box-shadow:inset 0 0 50px #000,0 0 65px #28dcff2b;position:relative;z-index:2}.coreball:after{content:"";position:absolute;inset:34%;border-radius:50%;border:1px solid #71edff66;box-shadow:0 0 20px #3ce4ff}.active .coreball{animation:beat .55s infinite;box-shadow:inset 0 0 50px #000,0 0 110px #28dcff88}.wave{position:absolute;border:1px solid #55eaff66;border-radius:50%;inset:18%;opacity:0}.active .wave{animation:wave 1.5s infinite}.wave:nth-child(2){inset:8%;animation-delay:.25s}.wave:nth-child(3){inset:-2%;animation-delay:.5s}.wave:nth-child(4){inset:-12%;animation-delay:.75s}h1{font-size:38px;margin:0}.sub{color:#7896aa;line-height:1.5;margin:8px auto;max-width:680px}.composer{display:flex;gap:8px;background:#06101a;border:1px solid #18384d;border-radius:16px;padding:7px;margin:20px auto 9px;max-width:780px}.input{flex:1;background:transparent;border:0;outline:0;color:white;padding:12px;font-size:15px}.btn{padding:12px 15px}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chip{padding:8px 12px}.chat{text-align:left;max-height:300px;overflow:auto;margin:12px auto;width:min(780px,100%)}.msg{background:#07131f;border:1px solid #102e40;border-left:3px solid #38d9ff;border-radius:11px;padding:11px;margin:7px 0;font-size:13px;line-height:1.45}.msg.me{border-left-color:#8b78ff}.msg small{display:block;color:#557286;margin-top:5px}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #112a3a;font-size:12px}.metric:last-child{border:0}.ok{color:#6eeebc}.clock{font-size:26px;font-weight:800}.date{color:#668397;font-size:11px}.history{max-height:220px;overflow:auto}.historyItem{padding:9px;border:1px solid #142f40;border-radius:10px;margin:5px 0;cursor:pointer;font-size:12px}.historyItem:hover{border-color:#2c7898;background:#091b28}.danger{width:100%;background:#190a10;border-color:#592430}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.footer{text-align:center;color:#496275;font-size:10px;padding:9px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);opacity:.5}}@keyframes beat{50%{transform:scale(1.06)}}@keyframes wave{0%{opacity:0;transform:scale(.5)}15%{opacity:.8}100%{opacity:0;transform:scale(1.2)}}@media(max-width:1000px){.layout{grid-template-columns:70px 1fr}.right{display:none}.left{padding:12px 8px}.nav{font-size:0;text-align:center}.project,.label{display:none}}@media(max-width:620px){.layout{display:block}.left{display:none}.core{width:270px;height:270px}.coreball{width:120px;height:120px}h1{font-size:28px}.composer{flex-wrap:wrap}.input{flex-basis:100%}.btn{flex:1}}body.light{background:#eaf5f9;color:#10202a}.light .app{background:radial-gradient(circle at 50% 10%,#d5f4ff,#f6fbfd 48%,#eaf5f9)}.light header,.light aside{background:#ffffffd9}.light .panel,.light .composer,.light .msg,.light .project,.light .nav,.light .btn,.light .chip{background:#fff;color:#17303e;border-color:#b8d2dd}.light .input{color:#10202a}.light .sub,.light .date,.light .label,.light .footer{color:#587383}</style></head><body><div class="app"><header><div class="brand"><div class="logo"></div>AURA</div><div class="status" id="status">● HAZIR</div></header><div class="layout"><aside class="left"><div class="label">MERKEZ</div><button class="nav active" id="home">◉ Ana merkez</button><button class="nav" id="memory">⌁ Sohbet geçmişi</button><button class="nav" id="voice">◌ Ses sistemi</button><button class="nav" id="settings">⚙ Ayarlar</button><button class="nav" id="about">ⓘ Hakkında</button><br><div class="label">PROJELER</div><div class="project"><b>◉ AURA</b><small>AI kişisel asistan</small></div></aside><main class="main"><section class="hero"><div class="core" id="core"><div class="orbit"></div><div class="orbit two"></div><div class="orbit three"></div><div class="orbit four"></div><i class="wave"></i><i class="wave"></i><i class="wave"></i><i class="wave"></i><div class="coreball"></div></div><h1 id="headline">Merhaba, ben AURA.</h1><div class="sub" id="sub">Sorunu yaz, AURA cevaplasın.</div><div class="composer"><input id="input" class="input" autocomplete="off" placeholder="AURA'ya bir şey sor..."><button class="btn" id="mic">🎙 Konuş</button><button class="btn" id="send">Gönder</button></div><div class="chips"><button class="chip" data-q="Saat kaç?">Saat</button><button class="chip" data-q="Bugün günlerden ne?">Tarih</button><button class="chip" data-q="Sistem durumunu göster">Sistem</button><button class="chip" data-q="Bana bir bilmece sor">Bilmece</button><button class="chip" data-q="Beni hatırlıyor musun?">Hafıza</button></div><div class="chat" id="chat"></div></section></main><aside class="right"><div class="panel"><div class="label">SAAT</div><div class="clock" id="clock">--:--</div><div class="date" id="date">--</div></div><div class="panel"><div class="label">SİSTEM</div><div class="metric"><span>Arayüz</span><b class="ok">AKTİF</b></div><div class="metric"><span>AI bağlantısı</span><b id="ai">BEKLEMEDE</b></div><div class="metric"><span>Ses çıkışı</span><b id="tts">HAZIR</b></div><div class="metric"><span>Kayıt</span><b class="ok" id="count">0</b></div><div class="tools"><button class="btn" id="export">Dışa aktar</button><button class="btn" id="theme">Tema</button></div></div><div class="panel"><div class="label">SON SOHBETLER</div><div class="history" id="history"></div><button class="btn danger" id="clear">Geçmişi temizle</button></div></aside></div><div class="footer">AURA • AI CORE • LOCAL MEMORY</div></div><script>const $=id=>document.getElementById(id),input=$("input"),chat=$("chat"),core=$("core"),status=$("status"),historyEl=$("history");let history=JSON.parse(localStorage.getItem("aura_history")||"[]");function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function render(){$("count").textContent=history.length;historyEl.innerHTML=history.slice(0,10).map((x,i)=>'<div class="historyItem" data-i="'+i+'"><b>'+esc(x.q)+'</b><small>'+esc(x.a)+'</small></div>').join('')||'<small style="color:#668397">Henüz sohbet yok.</small>';historyEl.querySelectorAll('.historyItem').forEach(e=>e.onclick=()=>run(history[+e.dataset.i].q))}function save(){localStorage.setItem("aura_history",JSON.stringify(history));render()}function localAnswer(q){let x=q.toLocaleLowerCase('tr-TR');if(x.includes('saat'))return'Saat şu anda '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+'.';if(x.includes('bugün')||x.includes('tarih')||x.includes('hangi gün'))return'Bugün '+new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';if(x.includes('sistem'))return'AURA arayüzü, yerel hafıza ve ses sistemi aktif. Gerçek AI bağlantısı Vercel üzerinden hazır.';if(x.includes('merhaba')||x.includes('selam'))return'Merhaba! AURA çevrimiçi.';if(x.includes('hafıza')||x.includes('hatırl'))return history.length?'Bu tarayıcıda '+history.length+' sohbet kaydı bulunuyor.':'Henüz kayıtlı bir sohbet yok.';if(x.includes('bilmece'))return'Bilmece: Yürüdükçe arkanda bıraktığın şey nedir?';return null}function speak(t){if(!window.speechSynthesis)return;let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.96;$("tts").textContent='KONUŞUYOR';core.classList.add('active');u.onend=()=>{$("tts").textContent='HAZIR';core.classList.remove('active')};speechSynthesis.cancel();speechSynthesis.speak(u)}async function run(q){q=q.trim();if(!q)return;chat.insertAdjacentHTML('beforeend','<div class="msg me"><b>SEN</b> · '+esc(q)+'</div>');input.value='';status.textContent='● DÜŞÜNÜYOR';core.classList.add('active');let local=localAnswer(q);if(local){finish(q,local,false);return}try{const recent=history.slice(0,12).reverse().flatMap(x=>[{role:'user',content:x.q},{role:'assistant',content:x.a}]);const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:recent})});const data=await r.json();if(!r.ok)throw new Error(data.error||'AI bağlantısı başarısız');$("ai").textContent='BAĞLI';finish(q,data.answer||'Cevap alınamadı.',true)}catch(e){$("ai").textContent='BEKLEMEDE';status.textContent='● YEREL MOD';core.classList.remove('active');chat.insertAdjacentHTML('beforeend','<div class="msg"><b>AURA</b> · '+esc('AI şu anda kullanılamıyor: '+e.message+' Yerel özellikler çalışmaya devam ediyor.')+'</div>')}}function finish(q,a,ai){chat.insertAdjacentHTML('beforeend','<div class="msg"><b>AURA</b> · '+esc(a)+'</div>');chat.scrollTop=chat.scrollHeight;history.unshift({q,a,time:Date.now(),ai});history=history.slice(0,100);save();status.textContent='● HAZIR';core.classList.remove('active');speak(a)}$("send").onclick=()=>run(input.value);input.onkeydown=e=>{if(e.key==='Enter')run(input.value)};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>run(b.dataset.q));$("mic").onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$("sub").textContent='Tarayıcı ses tanımayı desteklemiyor.';return}const r=new R;r.lang='tr-TR';r.onstart=()=>{status.textContent='● DİNLİYOR';core.classList.add('active')};r.onresult=e=>run(e.results[0][0].transcript);r.onerror=()=>{status.textContent='● HAZIR';core.classList.remove('active')};r.start()};$("clear").onclick=()=>{if(confirm('Sohbet geçmişi silinsin mi?')){history=[];save();chat.innerHTML=''}};$("export").onclick=()=>{const text=history.slice().reverse().map(x=>'SEN: '+x.q+'\nAURA: '+x.a).join('\n\n');const blob=new Blob([text||'AURA sohbet geçmişi boş.'],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aura-sohbet-gecmisi.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("theme").onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('aura_theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('aura_theme')==='light')document.body.classList.add('light');$("memory").onclick=()=>$("sub").textContent='Son 100 konuşma bu tarayıcıda yerel olarak tutuluyor.';$("voice").onclick=()=>$("sub").textContent='Türkçe mikrofon ve sesli cevap aktif.';$("settings").onclick=()=>$("sub").textContent='Ayarlar: yerel hafıza, ses ve tema sistemi aktif.';$("about").onclick=()=>$("sub").textContent='AURA — AI destekli kişisel asistan arayüzü.';$("home").onclick=()=>$("sub").textContent='Sorunu yaz, AURA cevaplasın.';function clock(){let d=new Date;$("clock").textContent=d.toLocaleTimeString('tr-TR');$("date").textContent=d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}clock();setInterval(clock,1000);render();</script></body></html>
