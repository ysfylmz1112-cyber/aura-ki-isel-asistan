<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>AURA — Kişisel Asistan</title><style>body{margin:0;background:#02050b;color:#eefaff;font-family:system-ui,sans-serif}.app{min-height:100vh;background:radial-gradient(circle at 50% 5%,#10304a,#050b13 40%,#02050b 75%)}header{height:70px;padding:0 25px;border-bottom:1px solid #163248;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:7px;font-size:21px}.logo{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:10px;border:1px solid #56e8ff88;border-radius:50%;box-shadow:0 0 25px #28cfff44}.logo:after{content:"";width:14px;height:14px;border-radius:50%;background:#39dfff;box-shadow:0 0 20px #48eaff}.status{font-size:11px;color:#69f0bd;border:1px solid #245640;border-radius:99px;padding:8px 12px}.grid{display:grid;grid-template-columns:230px 1fr 260px;min-height:calc(100vh - 70px)}aside{padding:20px;background:#040b13aa}.left{border-right:1px solid #122c40}.right{border-left:1px solid #122c40}.label{font-size:10px;letter-spacing:2px;color:#628095;margin:5px 0 10px}.nav{width:100%;padding:12px;margin:3px 0;border:1px solid transparent;border-radius:11px;background:transparent;color:#91aabb;text-align:left;cursor:pointer}.nav:hover,.nav.active{background:#091b2b;border-color:#1b4159;color:#fff}.panel{border:1px solid #16354b;background:#07121d;border-radius:14px;padding:13px;margin-top:10px}.main{display:flex;justify-content:center;padding:25px}.hero{width:min(800px,100%);text-align:center}.core{width:310px;height:310px;margin:auto;position:relative;display:grid;place-items:center}.core:before,.core:after{content:"";position:absolute;border:1px solid #42dcff55;border-radius:50%;inset:5%;animation:spin 14s linear infinite}.core:after{inset:-7%;border-style:dashed;animation:spin 22s linear infinite reverse}.ring{position:absolute;inset:16%;border:1px solid #50ddff55;border-radius:50%;animation:pulse 3s infinite}.orb{width:135px;height:135px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#121923,#010204 75%);border:1px solid #293b45;box-shadow:inset 0 0 50px #000,0 0 45px #2edfff33}.active .orb{animation:corePulse .5s infinite;box-shadow:inset 0 0 55px #000,0 0 80px #2edfff77}.v{position:absolute;inset:var(--i);border:1px solid #55e8ff66;border-radius:50%;opacity:0}.active .v{animation:vibrate 1.3s ease-out infinite;animation-delay:var(--d)}.v1{--i:12%;--d:0s}.v2{--i:8%;--d:.17s}.v3{--i:4%;--d:.34s}.v4{--i:0%;--d:.51s}.hero h1{font-size:34px;margin:0}.sub{color:#7894a9;margin:8px}.row{display:flex;gap:10px;margin-top:20px}.input{flex:1;padding:15px;border-radius:13px;border:1px solid #18364c;background:#06101a;color:white;outline:0}.btn,.chip{padding:12px 16px;border-radius:12px;border:1px solid #24617e;background:#082033;color:white;cursor:pointer}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}.chat{text-align:left;max-height:260px;overflow:auto;margin-top:12px}.msg{padding:11px 14px;margin:7px 0;background:#07131f;border-left:2px solid #2a718f;border-radius:0 10px 10px 0;color:#b5c9d5;font-size:13px}.msg.me{border-left-color:#4d83ff}.clock{font-size:24px;font-weight:700}.date,.tip{font-size:11px;color:#678397}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #11283a;font-size:12px}.ok{color:#69efbd}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px}.modal.show{display:grid}.box{max-width:500px;width:100%;padding:22px;border:1px solid #21445b;border-radius:18px;background:#07131f}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);opacity:.55}}@keyframes corePulse{50%{transform:scale(1.05)}}@keyframes vibrate{0%{opacity:0;transform:scale(.55)}12%{opacity:.9}100%{opacity:0;transform:scale(1.18)}}@media(max-width:900px){.grid{grid-template-columns:70px 1fr}.right{display:none}.left{padding:12px 7px}.nav{font-size:0;text-align:center}}@media(max-width:600px){.grid{display:block}.left{display:none}.core{width:250px;height:250px}.row{flex-direction:column}}</style></head><body><div class="app"><header><div class="brand"><span class="logo"></span>AURA</div><div class="status" id="status">● HAZIR</div></header><div class="grid"><aside class="left"><div class="label">AURA MERKEZİ</div><button class="nav active">◉ Ana merkez</button><button class="nav" id="memory">⌁ Hafıza</button><button class="nav" id="voice">◌ Ses</button><button class="nav" id="about">ⓘ Hakkında</button></aside><main class="main"><section class="hero"><div class="core" id="core"><div class="v v1"></div><div class="v v2"></div><div class="v v3"></div><div class="v v4"></div><div class="ring"></div><div class="orb"></div></div><h1 id="headline">Merhaba, ben AURA.</h1><div class="sub" id="sub">Sorunu yaz. AURA cevaplamaya çalışsın.</div><div class="row"><input class="input" id="input" placeholder="AURA'ya bir soru sor..."><button class="btn" id="send">Gönder</button><button class="btn" id="mic">🎙 Konuş</button></div><div class="chips"><button class="chip" data-q="Bugün hava nasıl?">Hava</button><button class="chip" data-q="Saat kaç?">Saat</button><button class="chip" data-q="Python nedir?">Python</button><button class="chip" data-q="Yapay zeka nedir?">Yapay zekâ</button></div><div class="chat" id="chat"></div></section></main><aside class="right"><div class="panel"><div class="label">SİSTEM</div><div class="clock" id="clock">--:--</div><div class="date" id="date">--</div></div><div class="panel"><div class="label">AURA</div><div class="metric"><span>Yanıt motoru</span><b class="ok">AKTİF</b></div><div class="metric"><span>Ses</span><b id="tts">HAZIR</b></div><div class="metric"><span>Mikrofon</span><b id="stt">HAZIR</b></div><div class="metric"><span>Hafıza</span><b class="ok">AKTİF</b></div></div></aside></div></div><div class="modal" id="modal"><div class="box"><button class="btn" id="close">Kapat</button><h2 id="mtitle"></h2><p class="tip" id="mbody"></p></div></div><script>const $=id=>document.getElementById(id),input=$("input"),chat=$("chat"),core=$("core"),status=$("status");let memory=JSON.parse(localStorage.getItem("aura_memory")||"[]");function safe(s){return s.replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function answer(q){const x=q.toLowerCase().trim();if(!x)return'Soru yazarsan cevaplayabilirim.';if(/^(merhaba|selam|hey|sa|slm)\b/.test(x))return'Merhaba! Ben AURA. Sana yardımcı olmaya hazırım.';if(x.includes('nasılsın')||x.includes('naber'))return'İyiyim, teşekkürler. Çalışıyorum ve seni dinliyorum.';if(x.includes('adın ne')||x.includes('kimsin'))return'Ben AURA, bu projedeki kişisel asistanım.';if(x.includes('saat'))return'Saat şu anda '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})+'.';if(x.includes('tarih')||x.includes('bugün günlerden'))return'Bugün '+new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';if(x.includes('python'))return'Python, öğrenmesi görece kolay ve çok amaçlı bir programlama dilidir. Web, otomasyon, veri bilimi ve yapay zekâ gibi alanlarda kullanılır.';if(x.includes('javascript'))return'JavaScript, özellikle web sayfalarını etkileşimli hale getirmek için kullanılan bir programlama dilidir.';if(x.includes('html'))return'HTML, web sayfalarının yapısını oluşturmak için kullanılan işaretleme dilidir.';if(x.includes('css'))return'CSS, web sayfalarının görünümünü ve düzenini belirlemek için kullanılır.';if(x.includes('yapay zeka')||x.includes('yapay zekâ'))return'Yapay zekâ, bilgisayarların öğrenme, tahmin, sınıflandırma ve dil işleme gibi görevleri gerçekleştirmesini sağlayan yöntemlerin genel adıdır.';if(x.includes('github'))return'GitHub, kod projelerini depolamak, sürüm kontrolü yapmak ve ekiplerle geliştirmek için kullanılan bir platformdur.';if(x.includes('oyun nasıl yapılır'))return'Oyun geliştirmek için Unity, Unreal Engine veya Godot gibi motorlar kullanılabilir. Önce küçük bir prototip yapmak iyi bir başlangıçtır.';if(x.includes('hava'))return'Hava durumu için internete bağlı canlı veri gerekir. Bu yerel AURA sürümünde canlı hava servisi bağlı değil.';if(x.includes('neden')||x.includes('nasıl')||x.includes('nedir')||x.includes('ne demek'))return'Bu konuda yardımcı olabilirim. Soruyu biraz daha ayrıntılı yazarsan daha açıklayıcı bir cevap verebilirim.';return'Bu soruyu şu anda yerel bilgi tabanımda bulamadım. AURA\'nın gerçek bir yapay zekâ motoruna bağlanmasıyla genel sorulara çok daha güçlü cevaplar verebilir.'}function speak(t){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.95;$("tts").textContent='KONUŞUYOR';core.classList.add('active');u.onend=()=>{$("tts").textContent='HAZIR';core.classList.remove('active')};speechSynthesis.cancel();speechSynthesis.speak(u)}function run(q){q=q.trim();if(!q)return;chat.insertAdjacentHTML('beforeend','<div class="msg me"><b>SEN</b> · '+safe(q)+'</div>');memory.unshift({q,t:Date.now()});memory=memory.slice(0,100);localStorage.setItem('aura_memory',JSON.stringify(memory));status.textContent='● DÜŞÜNÜYOR';core.classList.add('active');setTimeout(()=>{const r=answer(q);chat.insertAdjacentHTML('beforeend','<div class="msg"><b>AURA</b> · '+safe(r)+'</div>');$("sub").textContent=r;status.textContent='● HAZIR';core.classList.remove('active');speak(r);chat.scrollTop=chat.scrollHeight},250)}$("send").onclick=()=>{run(input.value);input.value=''};input.onkeydown=e=>{if(e.key==='Enter'){$("send").click()}};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>run(b.dataset.q));$("mic").onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$("sub").textContent='Bu tarayıcı mikrofonlu konuşmayı desteklemiyor.';return}const r=new R;r.lang='tr-TR';r.interimResults=false;r.onstart=()=>{$("stt").textContent='DİNLİYOR';status.textContent='● DİNLİYOR';core.classList.add('active')};r.onresult=e=>{input.value=e.results[0][0].transcript;run(input.value);input.value=''};r.onerror=()=>{$("stt").textContent='HAZIR';status.textContent='● HAZIR';core.classList.remove('active')};r.onend=()=>{$("stt").textContent='HAZIR';core.classList.remove('active')};r.start()};function clock(){const d=new Date;$("clock").textContent=d.toLocaleTimeString('tr-TR');$("date").textContent=d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}clock();setInterval(clock,1000);function modal(t,b){$("mtitle").textContent=t;$("mbody").textContent=b;$("modal").classList.add('show')}$("close").onclick=()=>$("modal").classList.remove('show');$("memory").onclick=()=>modal('Hafıza',memory.length+' konuşma yerel olarak saklanıyor.');$("voice").onclick=()=>modal('Ses','Türkçe sesli giriş ve çıkış kullanılabilir.');$("about").onclick=()=>modal('AURA','AURA kişisel asistan projesidir.');</script></body></html>
