<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA — Kişisel Asistan</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#03060b;color:#eaf7ff}body{display:flex;align-items:center;justify-content:center;overflow:hidden}.app{width:min(1200px,96vw);height:min(780px,94vh);position:relative;overflow:hidden;border:1px solid #183650;border-radius:28px;background:radial-gradient(circle at 50% 42%,#102a43 0,#07121f 30%,#03060b 72%);box-shadow:0 0 100px #0788cc22}.top{height:78px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #173149}.brand{font-size:25px;font-weight:800;letter-spacing:10px}.status{font-size:12px;letter-spacing:1px;color:#71d9ff}.main{height:calc(100% - 78px);display:flex;flex-direction:column;align-items:center}.core{width:250px;height:250px;margin-top:48px;border:1px solid #4bcfff88;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 40px #13a9ff44,inset 0 0 50px #0a6d9b33;transition:.3s}.core.active{box-shadow:0 0 90px #18baff88,inset 0 0 70px #0aa2dc55}.ring{position:absolute;border:1px solid #48c9ff55;border-radius:50%;width:115%;height:115%;animation:spin 12s linear infinite}.ring.r2{width:138%;height:138%;animation-duration:20s;animation-direction:reverse}.orb{width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#69ddff 14%,#1684ff 48%,#06182b 76%);box-shadow:0 0 65px #37cfff}.title{text-align:center;margin-top:28px}.title h1{margin:0;font-size:25px}.title p{margin:9px 0;color:#8ca8bd}.panel{position:absolute;left:28px;bottom:30px;padding:15px 18px;border:1px solid #18364e;border-radius:16px;background:#06101a99;color:#7592a8;font-size:11px;line-height:1.8}.controls{position:absolute;bottom:30px;right:28px;display:flex;gap:10px}.btn{border:1px solid #28506c;border-radius:13px;background:#091522;color:#e2f8ff;padding:12px 16px;cursor:pointer}.btn:hover{background:#10283b}.mic{border-color:#35caff}.history{position:absolute;right:28px;top:105px;width:210px;padding:14px;border:1px solid #18364e;border-radius:16px;background:#06101a99;font-size:11px;color:#7f9aad}.history b{color:#d9f5ff}.history div{margin-top:8px}.hidden{display:none}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">AURA</div><div class="status" id="status">● HAZIR</div></header>
<main class="main">
<section class="core" id="core"><div class="ring"></div><div class="ring r2"></div><div class="orb"></div></section>
<section class="title"><h1 id="message">Merhaba. Ben AURA.</h1><p id="sub">Sesli asistan hazır.</p></section>
</main>
<aside class="panel">SİSTEM: AKTİF<br>SES: HAZIR<br>AI CORE: v0.2</aside>
<aside class="history" id="history"><b>SON İŞLEM</b><div id="last">Henüz komut yok.</div></aside>
<div class="controls"><button class="btn mic" id="mic">🎙 Konuş</button><button class="btn" id="test">🔊 Ses Testi</button></div>
</div>
<script>
const $=id=>document.getElementById(id),status=$('status'),message=$('message'),sub=$('sub'),core=$('core'),last=$('last');
function speak(text){if(!('speechSynthesis'in window)){sub.textContent='Ses sistemi desteklenmiyor.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';u.rate=.95;u.pitch=.9;u.onstart=()=>{status.textContent='● KONUŞUYOR';core.classList.add('active')};u.onend=()=>{status.textContent='● HAZIR';core.classList.remove('active')};speechSynthesis.speak(u)}
$('test').onclick=()=>{message.textContent='AURA aktif.';sub.textContent='Ses sistemi çalışıyor.';last.textContent='Ses testi';speak('AURA aktif. Hazırım.')};
$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){message.textContent='Ses tanıma desteklenmiyor.';sub.textContent='Chrome veya desteklenen bir tarayıcı kullan.';return}const r=new R();r.lang='tr-TR';r.interimResults=false;r.maxAlternatives=1;status.textContent='● DİNLİYOR';core.classList.add('active');message.textContent='Seni dinliyorum...';sub.textContent='Konuşabilirsin.';r.onresult=e=>{const text=e.results[0][0].transcript;last.textContent=text;status.textContent='● DÜŞÜNÜYOR';message.textContent=text;sub.textContent='Komut alındı.';setTimeout(()=>speak('Mesajını aldım. Yapay zekâ motoru bir sonraki aşamada bağlanacak.'),350)};r.onerror=()=>{status.textContent='● HAZIR';core.classList.remove('active');message.textContent='Ses alınamadı.';sub.textContent='Mikrofon iznini kontrol et.'};r.onend=()=>{if(status.textContent==='● DİNLİYOR'){status.textContent='● HAZIR';core.classList.remove('active')}};r.start()};
</script>
</body>
</html>
