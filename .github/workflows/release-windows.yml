name: Publish AURA Windows Update

on:
  push:
    branches: [main]
    paths:
      - "desktop/package.json"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Prepare packaged renderer
        working-directory: desktop
        run: npm run prepare-renderer

      - name: Verify packaged renderer
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop/renderer/index.html")) { throw "renderer/index.html missing" }
          if (-not (Test-Path "desktop/renderer/local-ai.js")) { throw "renderer/local-ai.js missing" }

      - name: Create version tag
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          $tag = "v$version"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if (-not $existing) {
            git tag $tag
            git push origin $tag
          } else {
            Write-Host "Tag $tag already exists; keeping it."
          }

      - name: Build installer and updater metadata
        working-directory: desktop
        run: npx electron-builder --win nsis --publish never

      - name: Verify and publish release assets sequentially
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $files = @(
            "dist/AURA-Setup.exe",
            "dist/AURA-Setup.exe.blockmap",
            "dist/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Required release asset missing: $file" }
          }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --repo "${{ github.repository }}" --clobber
          } else {
            gh release create $tag $files --repo "${{ github.repository }}" --title "AURA $version" --notes "AURA desktop release $version"
          }
