name: Publish AURA Windows Update

on:
  push:
    branches: [main]
    paths:
      - "desktop/package.json"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Create version tag
        shell: pwsh
        run: |
          $version = node -p "require('./desktop/package.json').version"
          $tag = "v$version"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if (-not $existing) {
            git tag $tag
            git push origin $tag
          } else {
            Write-Host "Tag $tag already exists; keeping it."
          }

      - name: Publish installer and updater metadata
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
