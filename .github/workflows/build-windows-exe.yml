name: Build AURA Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "index.html"
      - "local-ai.js"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-Item -Path "desktop/dist/AURA-Setup.exe" -ErrorAction SilentlyContinue
          if (-not $installer) { throw "AURA installer was not generated." }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $($installer.Length) bytes"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows-Installer
          path: desktop/dist/AURA-Setup.exe
          if-no-files-found: error
          retention-days: 14
