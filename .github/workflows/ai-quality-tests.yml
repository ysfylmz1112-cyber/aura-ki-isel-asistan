name: AURA AI Quality Tests

on:
  push:
    branches: [main]
    paths:
      - "local-ai.js"
      - "index.html"
      - "tests/**"
      - "desktop/package.json"
      - ".github/workflows/ai-quality-tests.yml"
  pull_request:
    paths:
      - "local-ai.js"
      - "index.html"
      - "tests/**"
      - "desktop/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic AI quality tests
        run: node --check desktop/main.cjs && node --check desktop/shorts-renderer.cjs && node --check local-ai.js && node --test tests/local-ai-quality.test.cjs tests/youtube-studio.test.cjs
